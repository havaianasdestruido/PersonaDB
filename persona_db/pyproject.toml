[project]
name = "persona-db"
version = "0.1.0"
description = "Large synthetic human database engine (PostgreSQL + probabilistic motors)."
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary",
    "numpy",
    "scipy",
    "faker[pt_BR]",
    "networkx",
    "pandas",
    "sqlalchemy",
    "pydantic>=2",
    "rich",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "black", "mypy", "snakeviz"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["persona_db*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"